# Home Purchase Readiness — Planning & Accountability Configuration
# Goal: Sell current home and buy ~$650k home by late 2027
# State: Utah (4.85% flat income tax)

home_purchase:

  # ── ADBE RSU Grant ────────────────────────────────────────────────────────────
  # Total: 617 shares (155 cliff + 12 × 38.5 quarterly)
  # Cliff: 2026-12-15 | Quarterly: Mar/Jun/Sep/Dec 15 starting 2027-03-15
  # All net figures = shares × price × (1 − withholding). Gross shown for reference only.
  adbe_total_shares: 617
  adbe_cliff_shares: 155
  adbe_quarterly_shares: 38.5    # true average; 12 × 38.5 = 462 = 617 − 155
  rsu_withholding_default: 0.35  # sell-to-cover, valid range 0.28–0.42

  # ── ADBE Price Scenarios ──────────────────────────────────────────────────────
  # Swing: Low→High changes full-grant net by ~$60K. Default is near 52-wk low.
  adbe_price_default: 247
  adbe_price_low: 247
  adbe_price_mid: 325
  adbe_price_high: 400

  # Reference validation at $247 / 35% withholding (net):
  #   Dec 2026 cliff:           155 × 247 × 0.65 ≈ $24,888
  #   Cumul. through Sep 2027:  (155 + 3×38.5) × 247 × 0.65 ≈ $43,432
  #   Cumul. through Dec 2027:  (155 + 4×38.5) × 247 × 0.65 ≈ $49,614
  #   Full grant (617 shares):  617 × 247 × 0.65 ≈ $99,059

  # ── ESPP ─────────────────────────────────────────────────────────────────────
  # 15% of $150k base = $22,500/yr = $1,875/mo after-tax deduction
  # Purchase dates: Jun 30, Dec 31; 15% look-back discount → ~$2,000/purchase gain
  # Do NOT count ESPP gain as monthly income — it's a twice-yearly event.
  espp_rate_default: 0.15     # 0–0.15; expose as adjustable in dashboard
  espp_discount: 0.15         # look-back floor discount rate

  # ── Income (Utah) ──────────────────────────────────────────────────────────
  base_salary: 150000
  # Effective all-in rate: fed ~22% + Utah 4.85% + FICA ~1.4% ≈ 28%
  # Expose as a setting — state is Utah (flat 4.85%), adjust federal bracket as needed.
  effective_tax_rate: 0.28
  bonus_rate_default: 0.075   # 0–15% of base; conservative default
  bonus_withholding: 0.35     # supplemental withholding on bonus lump-sum

  # ── Current Home ─────────────────────────────────────────────────────────────
  current_mortgage_payment: 1850.0     # Current P&I monthly payment
  current_mortgage_rate: 2.75          # Current interest rate (%)

  # ── New Home ─────────────────────────────────────────────────────────────────
  target_home_price: 650000
  estimated_net_proceeds: 120000       # Estimated proceeds from current home sale
  new_payment_pi_low: 3400             # New P&I estimate — low end
  new_payment_pi_high: 3500            # New P&I estimate — high end
  new_payment_piti_low: 4200           # New PITI estimate — low end (w/ tax+ins+PMI)
  new_payment_piti_high: 4600          # New PITI estimate — high end

  # ── Timeline ─────────────────────────────────────────────────────────────────
  target_move_date: "2027-12-01"       # Target close / move date
  vest_event_date: "2026-12-01"        # December 2026 vest event

  # ── Savings Discipline ───────────────────────────────────────────────────────
  monthly_savings_goal: 500            # $500/mo from cutting subscriptions, Amazon, Walmart
  savings_tracking_start: "2026-01-01" # Month tracking began (for cumulative totals)

  # ── Spending Category Targets (monthly caps) ──────────────────────────────────
  # Each group defines what we're CUTTING and what the new target ceiling is.
  # "saved" each month = combined_target_ceiling - actual_spend (when positive).
  spending_targets:
    subscriptions:
      label: "Subscriptions / Streaming"
      target: 100                      # New monthly ceiling (was ~$150-200+ before cuts)
      categories:
        - "Entertainment"
        - "Subscriptions"
        - "Streaming"
        - "Software"
        - "Media"
        - "Apps & Games"
      merchants: []
    online_shopping:
      label: "Amazon / Online Shopping"
      target: 150                      # New monthly ceiling
      categories:
        - "Shopping"
        - "Online Shopping"
      merchants:
        - "Amazon"
        - "Amzn"
        - "amazon.com"
    grocery_walmart:
      label: "Groceries / Walmart"
      target: 600                      # Monthly ceiling for groceries + Walmart runs
      categories:
        - "Groceries"
        - "Food & Grocery"
        - "Food & Drink"
      merchants:
        - "Walmart"
        - "Wal-Mart"
        - "Sam's Club"

  # ── DTI Configuration ────────────────────────────────────────────────────────
  # Update gross_monthly_income to your actual gross (pre-tax) monthly income.
  # Current monthly obligations are pulled live from debts.yml + accounts.json.
  gross_monthly_income: 12000

  # ── Milestones ───────────────────────────────────────────────────────────────
  milestones:
    - id: "savings_discipline"
      label: "Begin $500/mo savings discipline"
      target_date: "2026-01-01"
    - id: "debt_payoff_amazon"
      label: "Pay off Amazon Store Card"
      target_date: "2026-06-01"
    - id: "vest_event"
      label: "December 2026 Vest Event"
      target_date: "2026-12-01"
    - id: "list_current_home"
      label: "List current home for sale"
      target_date: "2027-06-01"
    - id: "close_new_home"
      label: "Close on new home (~$650k)"
      target_date: "2027-12-01"
